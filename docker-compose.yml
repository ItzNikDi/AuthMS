services:
  auth-db:
    image: postgres:15
    restart: always
    ports:
      - "54320:5432"
    env_file:
      - .env
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  auth-pgdata:

networks:
  backend:
